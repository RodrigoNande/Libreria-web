<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilo1.css">
    <title>Librería RL</title>
</head>
<body>
    <!-- Encabezado principal -->
    <header class="header">
        <div class="logo">
            <button class="menu">☰</button>
            <span class="brand">Librería RL</span>
            <span class="star">★</span>
        </div>
        <div class="search-container">
            <input type="text" placeholder="¿Qué estás buscando?">
            <button class="search-button">🔍</button>
        </div>
        <nav class="nav-links">
            <a href="#">Mis listas</a>
            <a href="#">Mis pedidos</a>
            <a href="#">Mi Cuenta</a>               
            <a href="#">$0</a>
        </nav>
    </header>

    <!-- Menú secundario -->
    <nav class="menu-secundario">
        <a href="#">INICIO</a>
        <a href="#">SOBRE NOSOTROS</a>
        <a href="#">CATEGORÍA ▼</a>
        <a href="#">CONTACTO</a>
        <a href="#">TIENDA</a>
    </nav>

    <!-- Productos -->
    <main class="productos">
        <div class="producto">
            <img src="img/reloj.jpg" alt="Reloj y accesorios">
            <h3>Reloj y accesorios</h3>
            <p>Precio: <strong>$5.87</strong> <span class="descuento">-46% tiempo limitado</span></p>
            <p>Marca: 23K+</p>
            <p> : ★★★★☆ (2,330 opiniones)</p>
        </div>
        <div class="producto">
            <img src="img/ducha.jpg" alt="Ducha moderna">
            <h3>Ducha moderna</h3>
            <p>Precio: <strong>$9.34</strong> 
            <p>Marca: </p>
            <p>Precio Unitario:</p>
        </div>
    
    </main>
</body>
</html>
